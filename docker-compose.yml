# PostgreSQL para desarrollo y pruebas.
#   docker compose up -d
# Las migraciones las aplica el backend:  cd backend && npm run db:reset
services:
  db:
    image: postgres:16-alpine
    container_name: embarazo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: seguimiento_embarazo
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_postgres:
